<script>
    (function() {

      // MÃ¡scara bÃ¡sica para campo financeiro
      if (inputValor) {

          let val = e.target.value.replace(/[^0-9,\.]/g, '');

            e.target.value = val + ',00';
          }
        });
      }

      // Feedback tÃ¡til de gravaÃ§Ã£o
      if (btnSalvar && toast) {
