          </div>
        </div>

        <!-- Stepper Visual Badges / Tabs -->
        <div class="flex items-center gap-2 self-start sm:self-center">
          
          
          
        </div>

      <form id="form-cadastro" onsubmit="event.preventDefault(); alert('Cadastro salvo com sucesso!');" class="flex flex-col">

        <!-- ==========================================
             ETAPA 1: DADOS DA EMPRESA & CONTATOS
        =========================================== -->
        <div id="etapa-1" class="flex-col gap-6 flex">

          <!-- 1. IDENTIFICAÃ‡ÃƒO PRINCIPAL -->

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

          <!-- RODAPÃ‰ DA ETAPA 1 -->

            <button type="button" onclick="window.history.back()" class="bg-white hover:bg-[#f6f3f2] border-2 border-[#1c1b1b] px-6 py-3 font-bold uppercase text-xs sm:text-sm tracking-wide shadow-[3px_3px_0px_0px_#1c1b1b] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all cursor-pointer text-center">

        <!-- ==========================================

                    <option value="MA">MA - MaranhÃ£o</option>

  <script>

    function validarEAvancar() {
      const inputsObrigatoriosEtapa1 = document.querySelectorAll('#etapa-1 input[required]');
      let valido = true;

        if (!input.checkValidity()) {
          input.reportValidity();
          valido = false;
          return;
        }
      }
      if (valido) {
        irParaEtapa(2);
      }
    }

    function removeLinha(btn, containerId) {
      const container = document.getElementById(containerId);
      if (container.children.length > 1) {
        btn.closest('.telefone-item, .email-item').remove();
      }
      atualizarBotoesRemover(containerId);
    }

    function atualizarBotoesRemover(containerId) {
      const container = document.getElementById(containerId);
      const items = container.querySelectorAll('.telefone-item, .email-item');
      items.forEach((item) => {
        const btn = item.querySelector('.btn-remove');
        if (btn) {
          if (items.length === 1) {
            btn.classList.add('hidden');
          } else {
            btn.classList.remove('hidden');
          }
        }
      });
    }

    // Tratamento para tipo de nÃºmero do logradouro

        if (input.value === 'S/N') input.value = '';
        label.innerHTML = 'QUILÃ”METRO (KM) <span class="text-[#ba1a1a]">*</span>';
      } else if (valor === 'galpao_lote') {

        input.placeholder = 'EX: LOTE 12, QUADRA 04, GALPÃƒO C';
        if (input.value === 'S/N') input.value = '';
        label.innerHTML = 'LOTE / QUADRA / GALPÃƒO <span class="text-[#ba1a1a]">*</span>';
      } else if (valor === 'rural') {
        input.readOnly = false;
        input.placeholder = 'EX: SÃTIO SÃƒO JOSÃ‰, GLEBA 3';
        if (input.value === 'S/N') input.value = '';
        label.innerHTML = 'IDENTIFICAÃ‡ÃƒO RURAL <span class="text-[#ba1a1a]">*</span>';

        input.readOnly = false;
        input.placeholder = 'EX: 1250';

        label.innerHTML = 'DIGITE O NÃšMERO <span class="text-[#ba1a1a]">*</span>';

    }

    // MÃ¡scaras de entrada
    function formatCNPJ(input) {
      let v = input.value.replace(/\D/g, "");
      if (v.length > 14) v = v.substring(0, 14);
      v = v.replace(/^(\d{2})(\d)/, "$1.$2");
      v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
      v = v.replace(/\.(\d{3})(\d)/, ".$1/$2");
      v = v.replace(/(\d{4})(\d)/, "$1-$2");
      input.value = v;
    }

    function formatTelefone(input) {
      let v = input.value.replace(/\D/g, "");
      if (v.length > 11) v = v.substring(0, 11);
      if (v.length > 10) {
        // Celular 9 dÃ­gitos: (11) 98765-4321
        v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
      } else if (v.length > 6) {
        // Fixo ou celular digitando: (11) 4321-0987
        v = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, "($1) $2-$3");
      } else if (v.length > 2) {
        v = v.replace(/^(\d{2})(\d{0,5})$/, "($1) $2");
      }
      input.value = v;
    }

    function formatCEP(input) {
      let v = input.value.replace(/\D/g, "");
      if (v.length > 8) v = v.substring(0, 8);
      v = v.replace(/^(\d{5})(\d)/, "$1-$2");
      input.value = v;
    }
