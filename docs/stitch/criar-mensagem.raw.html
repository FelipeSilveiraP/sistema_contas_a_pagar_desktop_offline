                </button>

</div>

                SEG
              </button>
<button class="day-btn is-active py-2.5 px-2 bg-[#dc2626] text-white border-2 border-[#1c1b1b] shadow-[3px_3px_0px_0px_#1c1b1b] font-mono text-xs sm:text-sm font-bold uppercase active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all cursor-pointer flex items-center justify-center" data-day="ter" type="button">
                TER
              </button>
<button class="day-btn is-active py-2.5 px-2 bg-[#dc2626] text-white border-2 border-[#1c1b1b] shadow-[3px_3px_0px_0px_#1c1b1b] font-mono text-xs sm:text-sm font-bold uppercase active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all cursor-pointer flex items-center justify-center" data-day="qua" type="button">
                QUA
              </button>
<button class="day-btn is-active py-2.5 px-2 bg-[#dc2626] text-white border-2 border-[#1c1b1b] shadow-[3px_3px_0px_0px_#1c1b1b] font-mono text-xs sm:text-sm font-bold uppercase active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all cursor-pointer flex items-center justify-center" data-day="qui" type="button">
                QUI
              </button>
<button class="day-btn is-active py-2.5 px-2 bg-[#dc2626] text-white border-2 border-[#1c1b1b] shadow-[3px_3px_0px_0px_#1c1b1b] font-mono text-xs sm:text-sm font-bold uppercase active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all cursor-pointer flex items-center justify-center" data-day="sex" type="button">
                SEX
              </button>
<button class="day-btn py-2.5 px-2 bg-white text-[#1c1b1b] border-2 border-[#1c1b1b] shadow-[3px_3px_0px_0px_#1c1b1b] font-mono text-xs sm:text-sm font-bold uppercase hover:bg-[#f6f3f2] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all cursor-pointer flex items-center justify-center" data-day="sab" type="button">
                SÃB
              </button>
</div>

<!-- 2. CONTEÃšDO DA MENSAGEM -->
<section class="flex flex-col gap-4">
<div class="flex items-center gap-2 pb-2 border-b-2 border-[#1c1b1b]">
<span class="material-symbols-outlined text-lg text-[#1c1b1b]">chat</span>

<!-- TÃTULO DA MENSAGEM -->

</label>
<input class="w-full bg-white border-2 border-[#1c1b1b] px-3.5 py-2.5 text-sm sm:text-base font-semibold uppercase text-[#1c1b1b] placeholder:text-[#a09c89] shadow-[3px_3px_0px_0px_#1c1b1b] focus:outline-none focus:bg-[#fff5f5] focus:shadow-[4px_4px_0px_0px_#dc2626] transition-all" id="msg_titulo" name="msg_titulo" placeholder="EX: LEMBRETE PAGAMENTO ALUGUEL GALPÃƒO, REVISÃƒO CHAVEIRO..." required="" type="text">
</div>

<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="text-xs sm:text-sm font-bold uppercase tracking-wide text-[#1c1b1b]" for="msg_corpo">

</label>
<span class="font-mono text-xs text-[#7c775f] uppercase">TEXTO LIVRE</span>
</div>
<textarea class="w-full bg-white border-2 border-[#1c1b1b] px-3.5 py-2.5 text-sm sm:text-base font-medium text-[#1c1b1b] placeholder:text-[#a09c89] shadow-[3px_3px_0px_0px_#1c1b1b] focus:outline-none focus:bg-[#fff5f5] focus:shadow-[4px_4px_0px_0px_#dc2626] transition-all resize-y min-h-[120px]" id="msg_corpo" name="msg_corpo" placeholder="Digite aqui a mensagem ou lembrete para a equipe do chaveiro..." required="" rows="4"></textarea>
</div>
</div>
</section>
<!-- RODAPÃ‰ DE AÃ‡Ã•ES -->
<div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 pt-6 border-t-2 border-[#1c1b1b] mt-2">
<button class="bg-white hover:bg-[#f6f3f2] border-[3px] border-[#1c1b1b] px-6 py-3 font-bold uppercase text-xs sm:text-sm tracking-wide shadow-[4px_4px_0px_0px_#000000] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all cursor-pointer text-center" onclick="window.history.back()" type="button">
            CANCELAR
          </button>
<button class="bg-[#dc2626] hover:bg-[#b91c1c] text-white border-[3px] border-[#1c1b1b] px-8 py-3.5 font-bold uppercase text-sm sm:text-base tracking-wider shadow-[4px_4px_0px_0px_#000000] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[5px_5px_0px_0px_#000000] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all cursor-pointer flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined text-xl">save</span>
<span>SALVAR MENSAGEM</span>
</button>

</div>
<script>
    (function () {
      const today = new Date().toISOString().split('T')[0];
      const dtInicio = document.getElementById('dt_inicio');
      const dtFim = document.getElementById('dt_fim');
      const btnHoje = document.getElementById('btn-hoje');
      const btnDiasUteis = document.getElementById('btn-dias-uteis');
      const btnTodosDias = document.getElementById('btn-todos-dias');
      const dayBtns = document.querySelectorAll('.day-btn');

      if (dtInicio) dtInicio.value = today;

      if (btnHoje && dtInicio) {
        btnHoje.addEventListener('click', () => {
          dtInicio.value = today;
        });
      }

      function setDayState(btn, active) {
        if (active) {
          btn.classList.add('is-active', 'bg-[#dc2626]', 'text-white');
          btn.classList.remove('bg-white', 'text-[#1c1b1b]', 'hover:bg-[#f6f3f2]');
        } else {
          btn.classList.remove('is-active', 'bg-[#dc2626]', 'text-white');
          btn.classList.add('bg-white', 'text-[#1c1b1b]', 'hover:bg-[#f6f3f2]');
        }
      }

      dayBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const isActive = btn.classList.contains('is-active');
          setDayState(btn, !isActive);
        });
      });

      if (btnDiasUteis) {
        btnDiasUteis.addEventListener('click', () => {
          dayBtns.forEach(btn => {
            const day = btn.getAttribute('data-day');
            const isWorkday = ['seg', 'ter', 'qua', 'qui', 'sex'].includes(day);
            setDayState(btn, isWorkday);
          });
        });
      }

      if (btnTodosDias) {
        btnTodosDias.addEventListener('click', () => {
          dayBtns.forEach(btn => setDayState(btn, true));
        });
      }
    })();

    function salvarMensagem() {
      const form = document.getElementById('form-mensagem');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }
      alert('Mensagem cadastrada com sucesso!');
      window.history.back();
    }
  </script>
</body></html>
