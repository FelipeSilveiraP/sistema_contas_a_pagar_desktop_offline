server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
findesk.api-token=${FINDESK_API_TOKEN}
findesk.db.path=${FINDESK_DB_PATH:}
# backup dos dados em planilha na pasta do Google Drive; vazio = detecta "Meu Drive"
# (so com o banco operacional; com FINDESK_DB_PATH de teste fica desligado)
findesk.backup-drive.pasta=${FINDESK_PASTA_DRIVE:}
spring.application.name=findesk-backend
logging.level.root=INFO
# Fase 5: log em arquivo com rotacao. O Electron define FINDESK_LOG_FILE (pasta logs
# ao lado do banco); vazio (testes JUnit, execucao manual) = so console.
logging.file.name=${FINDESK_LOG_FILE:}
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.total-size-cap=50MB
logging.logback.rollingpolicy.max-history=30
# Protecao contra excesso de conexoes (auditoria de seguranca 2026-11-15). O unico
# cliente e a janela do sistema (poucas requisicoes por vez); estes tetos impedem
# que um programa local abra milhares de conexoes e esgote a memoria (-Xmx256m).
server.tomcat.threads.max=20
server.tomcat.max-connections=100
server.tomcat.accept-count=20
server.connection-timeout=15s
server.max-http-request-header-size=16KB
# limite do corpo tambem no Tomcat (o TokenFilter recusa antes, com 413)
server.tomcat.max-swallow-size=16MB
# nunca devolver detalhes internos (pilha de erro, mensagens) nas respostas
server.error.include-stacktrace=never
server.error.include-message=never
