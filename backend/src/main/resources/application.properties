server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
findesk.api-token=${FINDESK_API_TOKEN}
findesk.db.path=${FINDESK_DB_PATH:}
spring.application.name=findesk-backend
logging.level.root=INFO
# Fase 5: log em arquivo com rotacao. O Electron define FINDESK_LOG_FILE (pasta logs
# ao lado do banco); vazio (testes JUnit, execucao manual) = so console.
logging.file.name=${FINDESK_LOG_FILE:}
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.total-size-cap=50MB
logging.logback.rollingpolicy.max-history=30
