<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Cadastro de Banco — Sistema de Contas a Pagar — Chaveiro Universal</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'">
<link href="../css/fonts.css" rel="stylesheet">
<link href="../dist/tailwind.css" rel="stylesheet">
</head>
<body class="submenu-body bg-[#fcf9f8] text-[#1c1b1b] antialiased" data-tela="form-banco">
<div class="submenu-wrap">
<header id="nav-global"></header>
<main class="w-full">
<form id="form-banco" class="w-full bg-white border-4 border-[#1c1b1b] shadow-[6px_6px_0_0_#1c1b1b]" novalidate>
<div class="flex flex-wrap items-center gap-2 sm:gap-3 border-b-4 border-[#1c1b1b] bg-[#16a34a] px-4 py-2.5 sm:px-6">
<span class="material-symbols-outlined text-xl sm:text-2xl text-white font-bold">account_balance</span>
<h1 class="font-headline text-base sm:text-lg lg:text-xl font-bold uppercase tracking-tight text-white">CADASTRAR NOVO BANCO</h1>
</div>
<div class="border-b-2 border-[#1c1b1b] bg-[#fcf9f8] px-4 py-2 sm:px-6 font-headline text-xs sm:text-sm font-bold text-[#1c1b1b]">
Cadastre a instituição bancária usada na movimentação financeira da oficina.
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5 p-4 sm:p-6">
<div class="flex flex-col gap-1.5">
<label class="font-headline text-xs sm:text-sm font-bold uppercase tracking-wider text-[#1c1b1b]" for="campo-instituicao">Instituição Bancária</label>
<input class="form-campo w-full border-4 border-[#1c1b1b] bg-white px-3 py-2.5 font-mono text-sm sm:text-base text-[#1c1b1b] shadow-[3px_3px_0_0_#1c1b1b] focus:outline-none focus:-translate-x-0.5 focus:-translate-y-0.5 focus:shadow-[5px_5px_0_0_#1c1b1b]" id="campo-instituicao" name="instituicao" type="text" maxlength="120" autocomplete="off" placeholder="Ex.: Banco do Brasil" required>
<p class="campo-erro hidden font-headline text-xs font-bold text-[#b6212a]" data-erro-campo="instituicao"></p>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-headline text-xs sm:text-sm font-bold uppercase tracking-wider text-[#1c1b1b]" for="campo-chave-pix">Chave Pix (opcional)</label>
<input class="form-campo w-full border-4 border-[#1c1b1b] bg-white px-3 py-2.5 font-mono text-sm sm:text-base text-[#1c1b1b] shadow-[3px_3px_0_0_#1c1b1b] focus:outline-none focus:-translate-x-0.5 focus:-translate-y-0.5 focus:shadow-[5px_5px_0_0_#1c1b1b]" id="campo-chave-pix" name="chavePix" type="text" maxlength="77" autocomplete="off" placeholder="CPF, CNPJ, e-mail, telefone ou chave aleatória">
<p class="campo-erro hidden font-headline text-xs font-bold text-[#b6212a]" data-erro-campo="chavePix"></p>
</div>
</div>
<div class="flex flex-col gap-3 border-t-2 border-[#1c1b1b] bg-[#fcf9f8] px-4 py-4 sm:px-6">
<p class="hidden font-headline text-sm font-bold text-[#006c46]" id="feedback-banco" role="status"></p>
<div class="flex flex-wrap items-center gap-3">
<button class="inline-flex items-center gap-2.5 px-5 py-2.5 bg-[#16a34a] text-white border-4 border-[#1c1b1b] font-headline font-bold text-sm uppercase tracking-wider shadow-[4px_4px_0_0_#1c1b1b] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[6px_6px_0_0_#1c1b1b] active:translate-x-1 active:translate-y-1 active:shadow-[1px_1px_0_0_#1c1b1b] transition-all cursor-pointer" id="btn-salvar" type="submit">
<span class="material-symbols-outlined text-lg leading-none font-bold">save</span>
<span>Salvar</span>
</button>
<button class="inline-flex items-center gap-2.5 px-5 py-2.5 bg-white text-[#1c1b1b] border-4 border-[#1c1b1b] font-headline font-bold text-sm uppercase tracking-wider shadow-[4px_4px_0_0_#1c1b1b] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[6px_6px_0_0_#1c1b1b] active:translate-x-1 active:translate-y-1 active:shadow-[1px_1px_0_0_#1c1b1b] transition-all cursor-pointer" id="btn-cancelar" type="button">
<span class="material-symbols-outlined text-lg leading-none font-bold">close</span>
<span>Cancelar</span>
</button>
</div>
</div>
</form>
</main>
</div>
<script src="../dist/app.js"></script>
</body></html>
