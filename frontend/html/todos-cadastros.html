<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Todos os Cadastros — Sistema de Contas a Pagar — Chaveiro Universal</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'">
<link href="../css/fonts.css" rel="stylesheet">
<link href="../dist/tailwind.css" rel="stylesheet">
</head><body class="submenu-body bg-[#fcf9f8] text-[#1c1b1b] antialiased" data-tela="todos-cadastros">
<div class="submenu-wrap">
<header id="nav-global"></header>
<main class="w-full flex flex-col gap-4 sm:gap-5">
<section class="w-full bg-white border-2 border-[#1c1b1b]">
<div class="flex flex-wrap items-center gap-2 sm:gap-3 border-b-4 border-[#1c1b1b] bg-[#ea580c] px-4 py-2.5 sm:px-6">
<span class="material-symbols-outlined text-xl sm:text-2xl text-white font-bold">folder</span>
<h1 class="font-headline text-base sm:text-lg lg:text-xl font-bold uppercase tracking-tight text-white">TODOS OS CADASTROS</h1>
</div>
<div class="border-b-2 border-[#1c1b1b] bg-[#fcf9f8] px-4 py-2 sm:px-6 font-headline text-xs sm:text-sm font-bold text-[#1c1b1b]">
Consulte, edite ou exclua os cadastros de Empresas, Pagadores e Bancos.
</div>
<div class="flex flex-wrap items-center gap-2 sm:gap-3 border-b-2 border-[#1c1b1b] bg-white px-4 py-3 sm:px-6">
<button class="btn-filtro inline-flex items-center gap-2 px-4 py-2 border-4 border-[#1c1b1b] font-headline font-bold text-xs sm:text-sm uppercase tracking-wider shadow-[3px_3px_0_0_#1c1b1b] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[5px_5px_0_0_#1c1b1b] active:translate-x-1 active:translate-y-1 active:shadow-[1px_1px_0_0_#1c1b1b] transition-all cursor-pointer" id="btn-filtro-empresas" data-tipo="empresas" type="button" aria-pressed="true">
<span class="material-symbols-outlined text-base leading-none font-bold">apartment</span>
<span>Empresas</span>
</button>
<button class="btn-filtro inline-flex items-center gap-2 px-4 py-2 border-4 border-[#1c1b1b] font-headline font-bold text-xs sm:text-sm uppercase tracking-wider shadow-[3px_3px_0_0_#1c1b1b] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[5px_5px_0_0_#1c1b1b] active:translate-x-1 active:translate-y-1 active:shadow-[1px_1px_0_0_#1c1b1b] transition-all cursor-pointer" id="btn-filtro-pagadores" data-tipo="pagadores" type="button" aria-pressed="false">
<span class="material-symbols-outlined text-base leading-none font-bold">person</span>
<span>Pagadores</span>
</button>
<button class="btn-filtro inline-flex items-center gap-2 px-4 py-2 border-4 border-[#1c1b1b] font-headline font-bold text-xs sm:text-sm uppercase tracking-wider shadow-[3px_3px_0_0_#1c1b1b] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[5px_5px_0_0_#1c1b1b] active:translate-x-1 active:translate-y-1 active:shadow-[1px_1px_0_0_#1c1b1b] transition-all cursor-pointer" id="btn-filtro-bancos" data-tipo="bancos" type="button" aria-pressed="false">
<span class="material-symbols-outlined text-base leading-none font-bold">account_balance</span>
<span>Bancos</span>
</button>
<label class="sr-only" for="campo-pesquisa">Pesquisar cadastros</label>
<input class="form-campo flex-1 min-w-[12rem] border-4 border-[#1c1b1b] bg-white px-3 py-2 font-mono text-sm text-[#1c1b1b] shadow-[3px_3px_0_0_#1c1b1b] focus:outline-none focus:-translate-x-0.5 focus:-translate-y-0.5 focus:shadow-[5px_5px_0_0_#1c1b1b]" id="campo-pesquisa" type="search" maxlength="120" autocomplete="off" placeholder="Pesquisar...">
</div>
<div class="p-4 sm:p-6" id="tabela-area">
<p class="font-headline text-sm font-bold text-[#1c1b1b]" id="tabela-estado" role="status">Carregando cadastros...</p>
</div>
</section>
<div class="area-edicao-vazia aviso-selecao" id="selectionEmptyHint"><span class="material-symbols-outlined text-2xl" aria-hidden="true">touch_app</span><p>Nenhum cadastro selecionado — clique em uma linha para ver os detalhes e editar.</p></div>
<section class="w-full bg-white border-2 border-[#1c1b1b] flex flex-col hidden" id="editorContainer" aria-labelledby="editorRecordName">
<div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-5 bg-[#FFE600] border-b-2 border-[#1c1b1b]">
<div class="flex items-center gap-3 min-w-0">
<span class="material-symbols-outlined text-2xl text-[#1c1b1b] font-bold" aria-hidden="true">edit_note</span>
<div class="flex flex-col min-w-0">
<span class="text-xs font-mono font-bold uppercase tracking-wider">Cadastro selecionado</span>
<h2 class="text-base sm:text-lg font-bold text-[#1c1b1b] uppercase tracking-tight truncate" id="editorRecordName">—</h2>
</div>
</div>
<button class="bg-white hover:bg-neutral-100 text-[#1c1b1b] border-2 border-[#1c1b1b] font-mono text-xs font-bold px-3 py-1.5 transition-all flex items-center gap-1 cursor-pointer whitespace-nowrap" id="btnClearSelection" type="button">
<span class="material-symbols-outlined text-sm font-bold">close</span>
<span>FECHAR</span>
</button>
</div>
<p class="px-4 sm:px-5 py-2 border-b-2 border-[#1c1b1b] bg-[#fcf9f8] font-mono text-xs font-bold uppercase text-neutral-700 flex flex-wrap gap-x-5 gap-y-1">
<span>Tipo: <span class="text-[#1c1b1b] normal-case" id="detailTipo">—</span></span>
<span>Resumo: <span class="text-[#1c1b1b] normal-case" id="detailResumo">—</span></span>
</p>
<div class="p-4 sm:p-5 flex flex-col gap-5">
<div class="flex flex-col gap-2">
<span class="font-mono text-xs font-bold uppercase text-neutral-600">Ações</span>
<div class="flex flex-wrap gap-2">
<button class="btn-acao bg-white hover:bg-[#ffdad6] text-[#ba1a1a] sm:ml-auto" id="btn-edt-excluir" type="button"><span class="material-symbols-outlined text-base font-bold">delete</span>EXCLUIR</button>
</div>
</div>
<div class="flex flex-col gap-2 border-t-2 border-dashed border-[#1c1b1b] pt-4">
<span class="font-mono text-xs font-bold uppercase text-neutral-600">Alterar um campo</span>
<div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-start">
<div class="md:col-span-4 flex flex-col gap-1">
<label class="font-mono text-xs font-bold uppercase text-[#1c1b1b]" for="fieldSelect">Campo</label>
<select class="w-full bg-[#fcf9f8] border-2 border-[#1c1b1b] font-mono text-xs sm:text-sm font-bold px-3 py-2.5 focus:bg-white focus:outline-none focus:ring-0 uppercase cursor-pointer" id="fieldSelect"></select>
</div>
<div class="md:col-span-5 flex flex-col gap-1">
<label class="font-mono text-xs font-bold uppercase text-[#1c1b1b]" for="newValueInput">Novo valor</label>
<input class="w-full bg-white border-2 border-[#1c1b1b] font-mono text-xs sm:text-sm font-bold px-3 py-2.5 focus:bg-[#fff9d6] focus:outline-none focus:ring-0" id="newValueInput" placeholder="Digite o novo valor..." type="text" autocomplete="off">
<select class="hidden w-full bg-white border-2 border-[#1c1b1b] font-mono text-xs sm:text-sm font-bold px-3 py-2.5 focus:bg-[#fff9d6] focus:outline-none focus:ring-0 cursor-pointer" id="newValueSelect" aria-label="Novo valor"></select>
<div class="hidden flex flex-col gap-2" id="painelTelefones">
<div class="flex flex-col gap-2" id="lista-telefones-edt"></div>
<button class="self-start inline-flex items-center gap-1.5 px-3 py-1.5 bg-white text-[#1c1b1b] border-2 border-[#1c1b1b] font-mono text-xs font-bold uppercase cursor-pointer hover:bg-neutral-100" id="btn-add-telefone-edt" type="button">
<span class="material-symbols-outlined text-base leading-none font-bold">add</span><span>Telefone</span>
</button>
</div>
<p class="campo-erro hidden font-headline text-xs font-bold text-[#ba1a1a]" data-erro-campo="edicao"></p>
</div>
<div class="md:col-span-3 flex items-center gap-2 md:pt-5">
<button class="flex-1 bg-[#FFE600] hover:bg-[#ebd300] text-[#1c1b1b] border-2 border-[#1c1b1b] font-mono text-xs sm:text-sm font-bold px-3 py-2.5 shadow-[2px_2px_0px_0px_#1c1b1b] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all flex items-center justify-center gap-1.5 cursor-pointer whitespace-nowrap" id="btnApplyChange" type="button">
<span class="material-symbols-outlined text-base font-bold">check</span>
<span>APLICAR</span>
</button>
<button class="bg-white hover:bg-neutral-100 text-[#1c1b1b] border-2 border-[#1c1b1b] font-mono text-xs sm:text-sm font-bold px-3 py-2.5 transition-all flex items-center justify-center cursor-pointer whitespace-nowrap" id="btnCancelEdit" type="button">
<span>DESFAZER</span>
</button>
</div>
</div>
</div>
</div>
</section>
</main>
</div>
<script type="module" src="../dist/app.js"></script>
</body></html>
