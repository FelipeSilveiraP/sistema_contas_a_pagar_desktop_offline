<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Inserir Conta — Sistema de Contas a Pagar — Chaveiro Universal</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'">
<link href="../css/fonts.css" rel="stylesheet">
<link href="../dist/tailwind.css" rel="stylesheet">
</head><body class="submenu-body bg-[#fcf9f8] text-[#1c1b1b] antialiased" data-tela="inserir-conta">
<div class="submenu-wrap">
<header id="nav-global"></header>
<main class="w-full">
<form id="form-conta" class="w-full bg-white border-4 border-[#1c1b1b] shadow-[6px_6px_0_0_#1c1b1b]" novalidate>
<div class="flex flex-wrap items-center gap-2 sm:gap-3 border-b-4 border-[#1c1b1b] bg-[#ffe600] px-4 py-2.5 sm:px-6">
<span class="material-symbols-outlined text-xl sm:text-2xl text-[#1c1b1b] font-bold">receipt_long</span>
<h1 class="font-headline text-base sm:text-lg lg:text-xl font-bold uppercase tracking-tight text-[#1c1b1b]">INSERIR CONTA</h1>
</div>
<div class="border-b-2 border-[#1c1b1b] bg-[#fcf9f8] px-4 py-2 sm:px-6 font-headline text-xs sm:text-sm font-bold text-[#1c1b1b]">
<span id="etapa-rotulo">Etapa 1 de 2 — Valor e vencimento</span>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5 p-4 sm:p-6" id="etapa-1">
<div class="flex flex-col gap-1.5">
<label class="font-headline text-xs sm:text-sm font-bold uppercase tracking-wider text-[#1c1b1b]" for="campo-valor">Valor (R$)</label>
<input class="form-campo w-full border-4 border-[#1c1b1b] bg-white px-3 py-2.5 font-mono text-sm sm:text-base text-[#1c1b1b] shadow-[3px_3px_0_0_#1c1b1b] focus:outline-none focus:-translate-x-0.5 focus:-translate-y-0.5 focus:shadow-[5px_5px_0_0_#1c1b1b]" id="campo-valor" name="valor" type="text" maxlength="16" autocomplete="off" placeholder="0,00" required>
<p class="campo-erro hidden font-headline text-xs font-bold text-[#b6212a]" data-erro-campo="valor"></p>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-headline text-xs sm:text-sm font-bold uppercase tracking-wider text-[#1c1b1b]" for="campo-vencimento">Data de Vencimento</label>
<input class="form-campo w-full border-4 border-[#1c1b1b] bg-white px-3 py-2.5 font-mono text-sm sm:text-base text-[#1c1b1b] shadow-[3px_3px_0_0_#1c1b1b] focus:outline-none focus:-translate-x-0.5 focus:-translate-y-0.5 focus:shadow-[5px_5px_0_0_#1c1b1b]" id="campo-vencimento" name="vencimento" type="date" required>
<p class="campo-erro hidden font-headline text-xs font-bold text-[#b6212a]" data-erro-campo="vencimento"></p>
</div>
</div>

<div class="hidden grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5 p-4 sm:p-6" id="etapa-2">
<div class="flex flex-col gap-1.5">
<label class="font-headline text-xs sm:text-sm font-bold uppercase tracking-wider text-[#1c1b1b]" for="campo-fornecedor">Fornecedor (Empresa)</label>
<select class="form-campo w-full border-4 border-[#1c1b1b] bg-white px-3 py-2.5 font-mono text-sm sm:text-base text-[#1c1b1b] shadow-[3px_3px_0_0_#1c1b1b] focus:outline-none" id="campo-fornecedor" required>
<option value="">— Selecione —</option>
</select>
<p class="campo-erro hidden font-headline text-xs font-bold text-[#b6212a]" data-erro-campo="idEmpresa"></p>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-headline text-xs sm:text-sm font-bold uppercase tracking-wider text-[#1c1b1b]" for="campo-categoria">Categoria (opcional)</label>
<input class="form-campo w-full border-4 border-[#1c1b1b] bg-white px-3 py-2.5 font-mono text-sm sm:text-base text-[#1c1b1b] shadow-[3px_3px_0_0_#1c1b1b] focus:outline-none" id="campo-categoria" type="text" maxlength="60" autocomplete="off" list="lista-categorias" placeholder="Ex.: Aluguel, Material, Energia">
<datalist id="lista-categorias"></datalist>
<p class="campo-erro hidden font-headline text-xs font-bold text-[#b6212a]" data-erro-campo="categoria"></p>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-headline text-xs sm:text-sm font-bold uppercase tracking-wider text-[#1c1b1b]" for="campo-documento">Nº Documento / NF (opcional)</label>
<input class="form-campo w-full border-4 border-[#1c1b1b] bg-white px-3 py-2.5 font-mono text-sm sm:text-base text-[#1c1b1b] shadow-[3px_3px_0_0_#1c1b1b] focus:outline-none" id="campo-documento" type="text" maxlength="60" autocomplete="off" placeholder="Ex.: NF 12345">
<p class="campo-erro hidden font-headline text-xs font-bold text-[#b6212a]" data-erro-campo="numeroDocumento"></p>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-headline text-xs sm:text-sm font-bold uppercase tracking-wider text-[#1c1b1b]" for="campo-pagador">Quem vai pagar? (opcional)</label>
<select class="form-campo w-full border-4 border-[#1c1b1b] bg-white px-3 py-2.5 font-mono text-sm sm:text-base text-[#1c1b1b] shadow-[3px_3px_0_0_#1c1b1b] focus:outline-none" id="campo-pagador">
<option value="">— Não informado —</option>
</select>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-headline text-xs sm:text-sm font-bold uppercase tracking-wider text-[#1c1b1b]" for="campo-pasta">Boleto está na pasta?</label>
<select class="form-campo w-full border-4 border-[#1c1b1b] bg-white px-3 py-2.5 font-mono text-sm sm:text-base text-[#1c1b1b] shadow-[3px_3px_0_0_#1c1b1b] focus:outline-none" id="campo-pasta">
<option value="false" selected>NÃO</option>
<option value="true">SIM</option>
</select>
</div>
</div>

<div class="flex flex-col gap-3 border-t-2 border-[#1c1b1b] bg-[#fcf9f8] px-4 py-4 sm:px-6">
<p class="hidden font-headline text-sm font-bold text-[#006c46]" id="feedback-conta" role="status"></p>
<div class="flex flex-wrap items-center gap-3">
<button class="inline-flex items-center gap-2.5 px-5 py-2.5 bg-[#ffe600] text-[#1c1b1b] border-4 border-[#1c1b1b] font-headline font-bold text-sm uppercase tracking-wider shadow-[4px_4px_0_0_#1c1b1b] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[6px_6px_0_0_#1c1b1b] active:translate-x-1 active:translate-y-1 active:shadow-[1px_1px_0_0_#1c1b1b] transition-all cursor-pointer" id="btn-proxima" type="button">
<span class="material-symbols-outlined text-lg leading-none font-bold">arrow_forward</span>
<span>Avançar para Etapa 2</span>
</button>
<button class="hidden inline-flex items-center gap-2.5 px-5 py-2.5 bg-[#ffe600] text-[#1c1b1b] border-4 border-[#1c1b1b] font-headline font-bold text-sm uppercase tracking-wider shadow-[4px_4px_0_0_#1c1b1b] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[6px_6px_0_0_#1c1b1b] active:translate-x-1 active:translate-y-1 active:shadow-[1px_1px_0_0_#1c1b1b] transition-all cursor-pointer" id="btn-salvar" type="submit">
<span class="material-symbols-outlined text-lg leading-none font-bold">save</span>
<span>Inserir Conta</span>
</button>
<button class="hidden inline-flex items-center gap-2.5 px-5 py-2.5 bg-white text-[#1c1b1b] border-4 border-[#1c1b1b] font-headline font-bold text-sm uppercase tracking-wider shadow-[4px_4px_0_0_#1c1b1b] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[6px_6px_0_0_#1c1b1b] active:translate-x-1 active:translate-y-1 active:shadow-[1px_1px_0_0_#1c1b1b] transition-all cursor-pointer" id="btn-voltar-etapa" type="button">
<span class="material-symbols-outlined text-lg leading-none font-bold">arrow_back</span>
<span>Voltar para Etapa 1</span>
</button>
<button class="inline-flex items-center gap-2.5 px-5 py-2.5 bg-white text-[#1c1b1b] border-4 border-[#1c1b1b] font-headline font-bold text-sm uppercase tracking-wider shadow-[4px_4px_0_0_#1c1b1b] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[6px_6px_0_0_#1c1b1b] active:translate-x-1 active:translate-y-1 active:shadow-[1px_1px_0_0_#1c1b1b] transition-all cursor-pointer" id="btn-cancelar" type="button">
<span class="material-symbols-outlined text-lg leading-none font-bold">close</span>
<span>Cancelar</span>
</button>
</div>
</div>
</form>
</main>
</div>
<script type="module" src="../dist/app.js"></script>
</body></html>
